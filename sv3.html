<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파시스 sv3.0 클럽대회용</title>

<style>
body { font-family: sans-serif; margin:0; background:#f2f2f2; }
.container { max-width:600px; margin:20px auto; padding:15px; background:#fff; border-radius:10px; }
button { width:100%; padding:12px; margin-top:10px; font-size:16px; border:none; border-radius:6px; }
.green { background:#2e7d32; color:white; }
.purple { background:#7b1fa2; color:white; }
.gray { background:#777; color:white; }
input { width:100%; padding:10px; margin-top:5px; font-size:15px; }
#modal { display:none; position:fixed; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.5); }
#modalContent { background:#fff; width:90%; max-width:400px; margin:100px auto; padding:20px; border-radius:10px; }
</style>
</head>

<body>

<div class="container">
<h2>파시스 sv3.0 클럽대회용</h2>

<button class="green" onclick="openModal()">대회 관리자 도구 열기</button>

</div>

<div id="modal">
<div id="modalContent">

<h3>관리자 도구</h3>

<label>웹앱 URL (/exec)</label>
<input type="text" id="webAppUrl">

<button class="green" onclick="saveURL()">URL 저장</button>

<label>대회 코드</label>
<input type="text" id="eventCode">

<button class="purple" onclick="generateQR()">QR코드 생성</button>

<div id="qrArea" style="margin-top:15px;"></div>

<button class="gray" onclick="closeModal()">닫기</button>

</div>
</div>

<script>

function openModal() {
document.getElementById("modal").style.display="block";
}

function closeModal() {
document.getElementById("modal").style.display="none";
}

function saveURL() {
var url=document.getElementById("webAppUrl").value;
localStorage.setItem("webAppUrl",url);
alert("URL 저장 완료");
}

function generateQR() {

var url=document.getElementById("webAppUrl").value;
var code=document.getElementById("eventCode").value;

if(!url || !code){
alert("URL과 대회코드를 입력하세요");
return;
}

var full=url+"?eventCode="+encodeURIComponent(code);

document.getElementById("qrArea").innerHTML=
"<p>아래 링크를 복사하여 QR 생성기에서 사용하세요:</p>"+
"<textarea style='width:100%;height:80px;'>"+full+"</textarea>";

}

window.onload=function(){
var saved=localStorage.getItem("webAppUrl");
if(saved){
document.getElementById("webAppUrl").value=saved;
}
};

</script>

</body>
</html>
