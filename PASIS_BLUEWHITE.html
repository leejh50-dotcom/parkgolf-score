<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#102341;background:#eaf1fb;font-size:18px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:760px;margin:auto;background:#fff;min-height:100dvh;padding-bottom:32px}.hero{background:linear-gradient(125deg,#07396f,#0066ae 70%,#1694c1);color:#fff;padding:26px 17px 24px;text-align:center}.brand{font-weight:900;font-size:clamp(26px,6vw,38px);letter-spacing:-1px}.hero small{font-size:15px}.card{margin:14px 12px;padding:17px;border:1px solid #d9e6f6;border-radius:20px;box-shadow:0 5px 15px #0f39600b}.label{display:block;font-weight:800;font-size:18px;margin:10px 0 6px}.input{height:56px;width:100%;border:2px solid #c4d4e6;border-radius:11px;padding:0 12px;background:#fff;min-width:0;color:#112d55;font-size:19px}.input:focus{outline:3px solid #b8ddff;border-color:#1876d1}.date{background:#edf6ff;border-radius:13px;padding:12px 5px;text-align:center;font-weight:900;font-size:clamp(17px,5.3vw,27px);white-space:nowrap;letter-spacing:-.04em}.pair{display:grid;grid-template-columns:minmax(0,1fr) 94px;gap:9px}.teamcount{display:grid;grid-template-columns:minmax(0,1fr) 86px;gap:9px}.locationbox{display:flex;align-items:center;border:2px solid #b5cce8;border-radius:12px;overflow:hidden;height:58px;padding:0 10px;background:#fff;gap:5px}.locationbox .input{border:0;box-shadow:none;outline:0;width:100%;padding:0 6px}.fixedsuffix{font-size:18px;font-weight:900;white-space:nowrap;color:#0d315f}.date-row{margin-bottom:12px}.submitrow{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:10px;margin-top:18px}.person{display:flex;gap:8px}.person>.input{flex:1}.star{border:2px solid #e5bd47;border-radius:12px;background:#fff9dc;color:#a77b00;font-size:33px;min-height:62px;flex:none}.star:disabled{opacity:.40}.star.ready{background:#ffdddd;border-color:#e92b29;color:#c7121a;opacity:1;box-shadow:0 0 0 3px #ffecec}.star.active{background:#e92b29;color:#fff;border-color:#bb1111;opacity:1}.big{background:linear-gradient(#147ef3,#0649b1);border:0;border-radius:13px;color:white;min-height:60px;font-size:23px;font-weight:900;width:100%;box-shadow:0 4px 0 #0b3e7a}.hint{font-size:15px;color:#596b82;line-height:1.55;margin-top:8px}.muted{color:#586b83}.status{min-height:20px;font-size:16px;margin:9px 0 0;font-weight:700}.status.error{color:#b52635}.status.ok{color:#117144}.title{display:flex;align-items:center;justify-content:space-between;gap:7px;font-size:22px;font-weight:900;margin-bottom:14px}.counter{font-size:14px;background:#e9f1fc;color:#174f96;padding:6px 9px;border-radius:50px;white-space:nowrap}.teams{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}.team{border:2px solid #c3dfff;border-radius:15px;overflow:hidden}.team.white{border-color:#f2c9d1}.team h3{margin:0;text-align:center;background:#0668cd;color:#fff;padding:12px 0;font-size:21px}.team.white h3{background:#e04768}.entries{min-height:98px;padding:8px}.entry{display:flex;justify-content:space-between;gap:6px;border-bottom:1px solid #e3e9f0;padding:7px 2px;font-size:clamp(13px,3.6vw,18px);font-weight:700}.entry span{overflow-wrap:anywhere}.empty{text-align:center;color:#7c8da2;font-size:14px;padding:23px 3px;line-height:1.6}.totals{background:#e9f4ff;padding:10px 8px;font-weight:800}.white .totals{background:#fff0f3}.totalrow{display:flex;justify-content:space-between;gap:5px;padding:3px 0;font-size:15px}.winner{margin-top:12px;text-align:center;border-radius:15px;background:#fff5d6;padding:18px 8px;font-weight:900;color:#634200;font-size:24px}.winner.wait{background:#eef3f8;color:#65788f;font-size:17px}.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px}.action{border:0;min-height:69px;border-radius:14px;font-size:clamp(12px,3.5vw,17px);font-weight:900;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:7px 2px}.action b{font-size:22px}.gold{background:linear-gradient(#ffdb67,#e99f08);color:#573a00}.red{background:linear-gradient(#ff6379,#d92352)}.green{background:linear-gradient(#25be8c,#087d60)}.blue{background:linear-gradient(#338ff7,#0657b9)}.secondary{background:#f2f6fc;color:#24507b;border:1px solid #c8daef;border-radius:9px;padding:9px;font-weight:800}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.mini{font-size:13px}.count-status{border-radius:12px;background:#fff4d7;color:#8d3900;font-weight:900;padding:12px;text-align:center;font-size:19px;margin-top:12px}.count-status.ready{background:#e5f7e9;color:#176437}.guide{background:#fff8e3;border-radius:12px;padding:10px 8px;font-size:clamp(13px,3.6vw,17px);font-weight:800;text-align:center;margin-top:9px;color:#735017}.guide.ready{background:#ffe5e7;color:#b70f22}.guide.done{background:#e8f5e9;color:#145e36}.status{position:fixed;z-index:30;bottom:18px;left:50%;transform:translateX(-50%);width:min(92vw,520px);padding:12px 16px;background:#e9fff2;border-radius:14px;box-shadow:0 5px 25px #132a4a45;text-align:center;min-height:0;display:none}.status:not(:empty){display:block}.status.error{background:#fff0ef}.entry{opacity:1}.entry.reveal{animation:pairAppear .55s ease both}.summary-reveal{animation:pairAppear .6s ease both}@keyframes pairAppear{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:translateY(0)}}.notice{background:#f2f7fd;border-left:4px solid #3c85dc;padding:10px 12px;margin:12px;border-radius:6px;font-size:13px;line-height:1.55}.setup{background:#fff7df;color:#684f0a}.hide{display:none!important}dialog{border:none;border-radius:16px;max-width:min(95vw,480px);width:100%;box-shadow:0 18px 70px #0005;padding:21px}dialog::backdrop{background:#07152ca0}dialog h3{margin-top:0}dialog .row{justify-content:flex-end;margin-top:15px}dialog button{min-height:44px}#archiveView{white-space:pre-line;font-size:14px;line-height:1.8;max-height:55vh;overflow:auto;background:#f4f7fa;padding:12px;border-radius:10px}footer{font-size:12px;color:#7a8da1;text-align:center;padding:15px}

<body><div class="wrap">
<header class="hero"><div class="brand">🏌️ 파시스 <span style="color:#ffe064">청백</span> 게임</div><small>파크골프 친선경기 · 함께 즐기는 오늘의 운수</small></header>
<section class="card">
<div class="date-row"><div id="date" class="date" aria-label="자동 경기 날짜"></div></div>
<div class="locationbox"><span style="font-size:24px">📍</span><input class="input" id="course" placeholder="(    )" autocomplete="off" maxlength="45" aria-label="장소 이름"><span class="fixedsuffix">파크골프장</span></div>
<div class="teamcount">
 <div><label class="label" for="teamName">👥 팀명</label><input class="input" id="teamName" placeholder="팀명 입력" autocomplete="off" maxlength="40"></div>
 <div><label class="label" for="expected">👥 인원수</label><input class="input" id="expected" type="number" inputmode="numeric" min="2" max="50" placeholder="명"></div>
</div>
<div class="hint" style="margin-top:5px;color:#1451a5;font-weight:800">팀명: 4자 이상 (한글·영문·숫자)</div>
<div class="pair">
 <div><label class="label" for="player">👤 내 이름</label><input class="input" id="player" placeholder="이름 입력" autocomplete="name" maxlength="25"></div>
 <div><label class="label" for="score">⛳ 총점</label><input class="input" id="score" type="number" inputmode="numeric" placeholder="타수" min="1" max="500"></div>
</div>
<div class="submitrow"><button id="send" class="big">✈ 점수 제출</button><button id="star" class="star" disabled title="전원 전송 후 청백 무작위 결정" aria-label="청백 결정">☆</button></div>
<div class="guide" id="guide" role="status">별표를 누르면 모든 참가자에게 동일한 결과가 표시됩니다</div>
<div id="status" class="status" role="status"></div>
</section>
<section class="card"><div class="title">🏆 경기 결과 <span id="count" class="counter">참가 0명</span></div>
<div class="teams"><div class="team"><h3>🔵 청팀</h3><div class="entries" id="blueEntries"><div class="empty">👑 결정 전입니다</div></div><div class="totals"><div class="totalrow"><span>합계</span><span id="blueSum">—</span></div><div class="totalrow"><span>평균</span><span id="blueAvg">—</span></div></div></div><div class="team white"><h3>⚪ 백팀</h3><div class="entries" id="whiteEntries"><div class="empty">👑 결정 전입니다</div></div><div class="totals"><div class="totalrow"><span>합계</span><span id="whiteSum">—</span></div><div class="totalrow"><span>평균</span><span id="whiteAvg">—</span></div></div></div></div>
<div class="winner wait" id="winner">전원 전송 후 별표를 누르면 결과가 표시됩니다.</div><div id="pending" class="hint" style="text-align:center"></div></section>
<div class="actions"><button class="action red" id="clear" disabled><b>🗑</b>결과삭제</button><button class="action green" id="save" disabled><b>▣</b>저장</button><button class="action blue" id="load"><b>📂</b>불러오기</button></div>
<div id="modeNotice" class="notice setup"></div><footer>PASIS 청백 게임 1.2 · 큰 글씨 / 간편 점수 입력 / 공동 경기 결과</footer></div>
<dialog id="dialog"><h3 id="dialogTitle"></h3><div id="dialogBody"></div><div class="row"><button class="secondary" id="cancelDialog">닫기</button><button class="secondary" id="confirmDialog">확인</button></div></dialog>
<script>
/* 공개 배포용 설정: Supabase 프로젝트의 URL과 publishable(또는 anon) 키만 입력하세요. service_role 키는 절대 넣지 마세요. */
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const date=today();$('date').textContent=new Date(date+'T12:00:00').toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'}).replace(/\s+/g,' ');
const connected=!!(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase);const client=connected?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
let current=null,archive=null,loading=false,firstRevealAt=null,wasFinalized=false,revealRoom=null;const demoStorage='pasis_bluewhite_demo_v1';
const clean=s=>String(s??'').trim();const key=()=>[date,clean($('course').value),clean($('teamName').value)].join('¦');
const entryInputs=()=>({p_day:date,p_course:clean($('course').value),p_team:clean($('teamName').value)});
const expected=()=>Number($('expected').value);
const validExpected=()=>{if(!Number.isInteger(expected())||expected()<2||expected()>50)throw Error('인원수를 2~50명 사이에서 입력하세요.');};
const validRoom=()=>{if(!clean($('course').value))throw Error('장소를 입력하세요.');if([...clean($('teamName').value)].length<4)throw Error('팀명은 4자 이상 입력하세요.');};
const state=()=>{let all={};try{all=JSON.parse(localStorage.getItem(demoStorage)||'{}')}catch{};return all};
const saveDemo=x=>{let all=state();all[key()]=x;localStorage.setItem(demoStorage,JSON.stringify(all));window.dispatchEvent(new Event('storage'))};
const localId=()=>{let id=localStorage.getItem('pasis_bw_device_id');if(!id){id=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();localStorage.setItem('pasis_bw_device_id',id)}return id};
const empty=()=>({entries:[],organizer_uid:null,finalized:false,archive:null,expected_count:null});
const notice=(msg,error=false)=>{$('status').textContent=msg;$('status').className='status '+(error?'error':'ok');setTimeout(()=>{if($('status').textContent===msg)$('status').textContent=''},4500)};
const errMsg=e=>(e&&e.message)||'작업을 완료하지 못했습니다.';
const identity=async()=>{if(!connected)return localId();let {data:{session}}=await client.auth.getSession();if(!session){const {data,error}=await client.auth.signInAnonymously();if(error)throw error;session=data.session}return session.user.id};
const api=async(name,p={})=>{const {data,error}=await client.rpc(name,p);if(error)throw error;return data};
const get=async()=>{if(connected)return await api('pasis_get',entryInputs());return state()[key()]||empty()};
const currentOrganizer=async()=>{if(!current)return false;return current.organizer_uid===(await identity())};
const teamRows=(side,rows)=>{const node=$(side+'Entries');node.replaceChildren();if(!rows.length){const d=document.createElement('div');d.className='empty';d.textContent=current?.finalized?'배정 없음':'👑 결정 전입니다';node.appendChild(d);return}for(const p of rows){const row=document.createElement('div'),n=document.createElement('span'),s=document.createElement('strong');row.className='entry';if(firstRevealAt!==null){const offset=i*.7-(Date.now()-firstRevealAt)/1000;if(offset>-.55){row.classList.add('reveal');row.style.animationDelay=offset+'s'}}n.textContent=p.player_name;s.textContent=p.score;row.append(n,s);node.appendChild(row)}};
const display=async()=>{const rows=current?.entries||[],done=!!current?.finalized,cap=current?.expected_count||null;
if(cap && document.activeElement!==$('expected'))$('expected').value=cap;
let b=rows.filter(x=>x.side==='blue'),w=rows.filter(x=>x.side==='white');const thisRoom=key();if(revealRoom!==thisRoom){revealRoom=thisRoom;wasFinalized=false;firstRevealAt=null}if(done&&!wasFinalized)firstRevealAt=Date.now();if(!done)firstRevealAt=null;wasFinalized=done;teamRows('blue',b);teamRows('white',w);
for(const [id,arr] of [['blue',b],['white',w]]){$(id+'Sum').textContent=done?arr.reduce((s,x)=>s+x.score,0):'—';$(id+'Avg').textContent=done&&arr.length?(arr.reduce((s,x)=>s+x.score,0)/arr.length).toFixed(2):'—';}
$('count').textContent=`전송 ${rows.length}${cap?'/'+cap:''}명`;
const remaining=cap===null?null:Math.max(0,cap-rows.length),full=cap!==null&&rows.length===cap;
const guide=$('guide');guide.classList.toggle('ready',full&&!done);guide.classList.toggle('done',done);
guide.textContent=done?'청백 결정 완료 · 모든 참가자에게 동일한 결과가 표시됩니다':cap===null?'별표를 누르면 모든 참가자에게 동일한 결과가 표시됩니다':remaining>0?`${remaining}명 미전송입니다 (${rows.length}/${cap}명)`:'전원 전송 완료! 빨간 별표를 누르면 모두에게 동일한 결과가 표시됩니다';
$('pending').textContent=done?'청백 무작위 배정 완료 · 모든 회원에게 동일하게 표시됩니다.':full?'전원 전송 완료 · 별표를 누르세요.':`참가자 전원 전송 전에는 청백 결정을 할 수 없습니다.`;
let bavg=b.length?b.reduce((s,x)=>s+x.score,0)/b.length:null,wavg=w.length?w.reduce((s,x)=>s+x.score,0)/w.length:null;
$('winner').textContent=done?(bavg===null||wavg===null?'참가 인원이 부족합니다.':Math.abs(bavg-wavg)<1e-9?'🏆 무승부':bavg<wavg?'🏆 청팀 승리!':'🏆 백팀 승리!'):'전원 전송 후 별표를 누르면 결과가 표시됩니다.';
$('winner').className='winner '+(!done?'wait':'');const age=firstRevealAt===null?999:(Date.now()-firstRevealAt)/1000;const revealFinish=Math.max(b.length,w.length)*.7+.25;for(const el of [$('winner'),...document.querySelectorAll('.totals')]){el.classList.remove('summary-reveal');el.style.animationDelay='';if(done&&age<revealFinish+.6){el.classList.add('summary-reveal');el.style.animationDelay=(revealFinish-age)+'s'}}const org=await currentOrganizer();const uid=await identity();
$('star').disabled=!full||done;
$('star').classList.toggle('ready',full&&!done);$('star').classList.toggle('active',org&&!done);$('star').textContent='☆';
$('clear').disabled=!org||rows.length===0;$('save').disabled=!org||!done;
let mine=rows.find(x=>x.user_uid===uid);if(mine&&!document.activeElement.matches('input')){$('player').value=mine.player_name;$('score').value=mine.score;}
};
const refresh=async(silent=false)=>{if(!clean($('course').value)||[...clean($('teamName').value)].length<4)return;try{await identity();current=await get();await display();if(!silent)notice('최신 결과를 불러왔습니다.')}catch(e){if(!silent)notice(errMsg(e),true)}};
const call=async(action)=>{if(loading)return;loading=true;try{validRoom();await identity();await action();current=await get();await display()}catch(e){notice(errMsg(e),true)}finally{loading=false}};
$('star').onclick=async()=>{if(!confirm('참가자 전원의 점수를 확인했습니다.\n별표를 눌러 청백팀을 무작위로 결정할까요?'))return;await call(async()=>{if(!current)current=await get();const rows=current.entries||[],cap=current.expected_count;if(!cap||rows.length!==cap)throw Error(`${Math.max(0,(cap||0)-rows.length)}명 미전송입니다.`);if(current.finalized)throw Error('이미 결과가 결정되었습니다.');if(connected){await api('pasis_claim',entryInputs());await api('pasis_draw',entryInputs())}else{const x=state()[key()]||empty(),id=localId();if(!x.entries.some(p=>p.user_uid===id))throw Error('먼저 본인 점수를 제출하세요.');if(x.organizer_uid&&x.organizer_uid!==id)throw Error('이미 다른 회원이 결정하였습니다.');x.organizer_uid=id;const shuffled=[...x.entries];for(let i=shuffled.length-1;i>0;i--){const a=new Uint32Array(1);crypto.getRandomValues(a);const j=a[0]%(i+1);[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}shuffled.forEach((p,i)=>p.side=i<Math.ceil(shuffled.length/2)?'blue':'white');x.entries=shuffled;x.finalized=true;saveDemo(x)}notice('청백팀 결정 완료!')})};
$('send').onclick=()=>call(async()=>{validExpected();const name=clean($('player').value),score=Number($('score').value),cap=expected();
if(!name)throw Error('이름을 입력하세요.');if(!Number.isInteger(score)||score<1||score>500)throw Error('총점을 1~500 사이의 정수로 입력하세요.');
if(connected)await api('pasis_submit',{...entryInputs(),p_name:name,p_score:score,p_expected:cap});
else{const x=state()[key()]||empty();if(x.finalized)throw Error('이미 결정된 경기입니다.');if(x.expected_count!==null&&x.expected_count!==cap)throw Error(`이 경기는 ${x.expected_count}명으로 등록되어 있습니다. 인원수를 맞춰 주세요.`);
const id=localId();if(x.entries.some(p=>p.player_name===name&&p.user_uid!==id))throw Error('같은 이름이 이미 등록되었습니다. 이름을 구분해서 입력하세요.');if(!x.entries.some(p=>p.user_uid===id)&&x.entries.length>=cap)throw Error('설정된 인원이 모두 등록되었습니다.');
x.expected_count=cap;x.entries=x.entries.filter(p=>p.user_uid!==id);x.entries.push({user_uid:id,player_name:name,score,side:null});saveDemo(x)}
notice('점수가 등록되었습니다.');});
$('clear').onclick=async()=>{if(!confirm('현재 경기의 점수와 청백 결과를 모두 삭제할까요?\n이미 저장한 보관 기록은 유지됩니다.'))return;await call(async()=>{if(connected)await api('pasis_clear',entryInputs());else{const x=state()[key()];if(x.organizer_uid!==localId())throw Error('진행자만 삭제할 수 있습니다.');x.entries=[];x.finalized=false;x.organizer_uid=null;x.expected_count=null;saveDemo(x)}notice('현재 경기 결과를 삭제했습니다.')})};
$('save').onclick=()=>call(async()=>{if(connected)await api('pasis_save',entryInputs());else{const x=state()[key()];if(x.organizer_uid!==localId())throw Error('진행자만 저장할 수 있습니다.');if(!x.finalized)throw Error('결정 후 저장하세요.');x.archive={saved_at:new Date().toISOString(),entries:structuredClone(x.entries),finalized:true};saveDemo(x)}notice('결과를 보관함에 저장했습니다.')});
const d=$('dialog');$('cancelDialog').onclick=()=>d.close();$('confirmDialog').onclick=()=>d.close();
$('load').onclick=async()=>{try{validRoom();await identity();archive=connected?await api('pasis_load',entryInputs()):((state()[key()]||{}).archive||null);if(!archive){notice('이 날짜·골프장·팀명으로 저장된 결과가 없습니다.',true);return}const a=archive.entries||[];const list=s=>a.filter(x=>x.side===s),sum=s=>list(s).reduce((n,x)=>n+x.score,0),average=s=>list(s).length?(sum(s)/list(s).length).toFixed(2):'—';$('dialogTitle').textContent='📂 저장된 경기 결과';$('dialogBody').replaceChildren();const content=document.createElement('div');content.id='archiveView';content.textContent=`저장 일시: ${archive.saved_at?new Date(archive.saved_at).toLocaleString('ko-KR'):'기록 없음'}\n\n🔵 청팀\n${list('blue').map(x=>x.player_name+'  '+x.score+'타').join('\n')}\n합계 ${sum('blue')} / 평균 ${average('blue')}\n\n⚪ 백팀\n${list('white').map(x=>x.player_name+'  '+x.score+'타').join('\n')}\n합계 ${sum('white')} / 평균 ${average('white')}`;$('dialogBody').appendChild(content);d.showModal();notice('저장된 결과를 불러왔습니다.')}catch(e){notice(errMsg(e),true)}};
const qs=new URL(location.href).searchParams;$('course').value=qs.get('course')||localStorage.getItem('pasis_course')||'';$('teamName').value=qs.get('team')||localStorage.getItem('pasis_team')||'';$('expected').value=qs.get('expected')||localStorage.getItem('pasis_expected')||'';
for(let id of ['course','teamName','expected'])$(id).addEventListener('change',()=>{localStorage.setItem(id==='course'?'pasis_course':id==='teamName'?'pasis_team':'pasis_expected',clean($(id).value));current=null;['clear','save','star'].forEach(x=>$(x).disabled=true);refresh(true)});
$('modeNotice').innerHTML=connected?'✅ <strong>공동 서버 연결 모드</strong> · 회원의 점수는 서버에 보관되며 약 5초 간격으로 새로 반영됩니다.':'⚠️ <strong>단독 시험 모드</strong> · 이 화면은 이 브라우저에만 저장됩니다. 여러 휴대폰에서 공유하려면 HTML 상단에 Supabase URL·공개 키를 설정하고 제공된 SQL을 실행해야 합니다.';
if(connected)identity().then(()=>refresh(true)).catch(e=>notice('인증 실패: '+errMsg(e),true));else refresh(true);setInterval(()=>{if(!document.hidden&&!loading&&!d.open)refresh(true)},5000);
})();
</script></body></html>
