/* V1.9: 경기 결과 명단 이름과 타수를 같은 크기로 확대 */
.entry .entry-name:not(.long-name),
.entry .entry-score {
  font-size: clamp(18px, 5vw, 22px);

<body><div class="wrap">
<header class="hero"><div class="brand">🏌️ 파시스 <span style="color:#ffe064">청백</span> 게임</div><small>파크골프 친선경기 · 함께 즐기는 오늘의 운수</small></header>
<section class="card">
<div class="date-row"><div id="date" class="date" aria-label="자동 경기 날짜"></div></div>
<div class="locationbox"><span style="font-size:24px">📍</span><input class="input" id="course" placeholder="(　　　　　)" autocomplete="off" maxlength="45" aria-label="장소 이름"><span class="fixedsuffix">파크골프장</span></div>
<div class="teamcount">
 <div><label class="label" for="teamName">👥 팀명</label><input class="input" id="teamName" placeholder="팀명 입력" autocomplete="off" maxlength="40"></div>
 <div><label class="label" for="expected">👥 인원수</label><input class="input" id="expected" type="number" inputmode="numeric" min="2" max="50" placeholder="명"></div>
</div>
<div class="hint" style="margin-top:5px;color:#1451a5;font-weight:800">팀명: 4자 이상 (한글·영문·숫자)</div>
<div class="pair">
 <div><label class="label" for="player">👤 내 이름</label><input class="input" id="player" placeholder="이름 입력" autocomplete="name" maxlength="25"></div>
 <div><label class="label" for="score">⛳ 총점</label><input class="input" id="score" type="number" inputmode="numeric" placeholder="타수" min="1" max="500"></div>
</div>
<div class="submitrow"><button id="send" class="big">✈ 점수 제출</button><button id="star" class="star" disabled title="전원 전송 후 청백 무작위 결정" aria-label="청백 결정">☆</button></div>
<div class="guide" id="guide" role="status">별표를 누르면 각자 휴대폰에 동일한 결과가 표시됩니다</div>
<div id="status" class="status" role="status"></div>
<div id="sendSuccessOverlay" class="send-success-overlay" role="status" aria-live="polite" aria-hidden="true"><div class="send-success-box"><span class="send-success-check">✓</span>점수 전송 완료</div></div>
</section>
<section class="card"><div class="title"><span class="title-text">🏆 경기 결과</span><span id="count" class="counter">참가 0명</span></div>
<div class="teams"><div class="team"><h3>🔵 청팀</h3><div class="entries" id="blueEntries"><div class="empty">👑 결정 전입니다</div></div><div class="totals"><div class="totalrow"><span>합계</span><span id="blueSum">—</span></div><div class="totalrow"><span>평균</span><span id="blueAvg">—</span></div></div></div><div class="team white"><h3>⚪ 백팀</h3><div class="entries" id="whiteEntries"><div class="empty">👑 결정 전입니다</div></div><div class="totals"><div class="totalrow"><span>합계</span><span id="whiteSum">—</span></div><div class="totalrow"><span>평균</span><span id="whiteAvg">—</span></div></div></div></div>
<div class="winner wait" id="winner">전원 전송 후 별표를 누르면 결과가 표시됩니다.</div><div id="pending" class="hint" style="text-align:center"></div></section>
<div class="actions"><button class="action red" id="clear" disabled><b>🗑</b>결과삭제</button><button class="action green" id="save" disabled><b>▣</b>저장</button><button class="action blue" id="load"><b>📂</b>불러오기</button></div>
<div id="modeNotice" class="notice setup"></div><footer>PASIS 청백 게임 1.9 PWA · Firebase 공동 전송</footer></div>
<dialog id="dialog"><h3 id="dialogTitle"></h3><div id="dialogBody"></div><div class="row"><button class="secondary" id="cancelDialog">닫기</button><button class="secondary" id="confirmDialog">확인</button></div></dialog>
<script type="module">

const firebaseConfig = {
  apiKey: "AIzaSyBNbq2FrhYat_vAtgfGbNzl mZW9xtWeKsI".replace(' ',''),
  authDomain: "pasis-bluewhite.firebaseapp.com",
  projectId: "pasis-bluewhite",
  storageBucket: "pasis-bluewhite.firebasestorage.app",
  messagingSenderId: "746057462418",
  appId: "1:746057462418:web:4bf8fbc99bf588fb13ac4b"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const $ = id => document.getElementById(id);

$('date').textContent = new Date(day+'T12:00:00').toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'}).replace(/\s+/g,' ');
let uid=null, roomRef=null, unsubscribe=null, current=null, busy=false, revealTimer=null, revealTimeouts=[], lastDrawKey='', snapshotFromServer=false;
// 공동 추첨은 1회만 저장하고, 결과 공개 여부는 각 휴대폰에서 개별 관리합니다.
let localRevealToken='', wantReveal=false;
const currentRoom = () => [day,clean($('course').value),clean($('teamName').value)].join('|');

const validRoom = () => {
  if (!clean($('course').value)) throw Error('장소를 입력하세요.');
  if ([...clean($('teamName').value)].length < 4) throw Error('팀명은 4자 이상 입력하세요.');
};

const notify = (message,error=false)=>{
  const el=$('status');el.textContent=message;el.className='status '+(error?'error':'ok');
  setTimeout(()=>{if(el.textContent===message)el.textContent=''},5500);
};
let sendSuccessTimer=null;
function showSendSuccess(){
  const el=$('sendSuccessOverlay');
  clearTimeout(sendSuccessTimer);
  el.classList.add('show');el.setAttribute('aria-hidden','false');
  sendSuccessTimer=setTimeout(()=>{el.classList.remove('show');el.setAttribute('aria-hidden','true');},2100);
}
const errText = e => {
  const c=e?.code||'';
  if(c.includes('permission-denied')) return '서버 접근이 거부되었습니다. Firestore 규칙이 게시되었는지 확인하세요.';
  if(c.includes('unavailable'))return '인터넷 또는 Firebase 연결 상태를 확인하세요.';
  return e?.message || '작업에 실패했습니다.';
};
async function roomId(){
  const bytes=new TextEncoder().encode(currentRoom());
  const hash=await crypto.subtle.digest('SHA-256',bytes);
  return Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join('');
}
function playersOf(r){return Object.entries(r?.players||{}).map(([id,x])=>({id,name:x.name,score:x.score,side:r?.assignments?.[id]||null}));}
function totalOf(a){const sum=a.reduce((n,x)=>n+x.score,0);return {sum,average:a.length?sum/a.length:0};}
function addRows(container,items){
  const node=$(container+'Entries');node.replaceChildren();
  if(!items.length){const d=document.createElement('div');d.className='empty';d.textContent=current?.finalized&&localRevealToken===current.draw_token?'배정 없음':current?.finalized?'빨간 별표를 누르면 공개됩니다':'👑 결정 전입니다';node.append(d);return;}
  items.forEach((p,index)=>{
    const row=document.createElement('div');row.className='entry';
    const number=document.createElement('span');number.className='entry-number';number.textContent=`${index+1}.`;
    const name=document.createElement('span');name.className='entry-name';name.textContent=p.name;
    if([...p.name].length>=5)name.classList.add('long-name');
    const score=document.createElement('span');score.className='entry-score';score.textContent=String(p.score);
    row.append(number,name,score);node.append(row);
  });
}
function render(){
  const r=current;const list=playersOf(r),cap=r?.expected_count??null,done=!!r?.finalized;
  const countNum=list.length,full=cap!==null&&countNum===cap;
  // 다른 경기가 시작되거나 결과가 삭제되면 각 휴대폰의 공개 상태를 초기화합니다.
  if(!done){localRevealToken='';wantReveal=false;lastDrawKey='';}
  const reveal=done&&!!r?.draw_token&&localRevealToken===r.draw_token;
  if(cap!==null&&document.activeElement!==$('expected'))$('expected').value=cap;
  $('count').textContent=`전송 ${countNum}${cap?'/'+cap:''}명`;
  const blue=list.filter(p=>p.side==='blue'),white=list.filter(p=>p.side==='white');
  addRows('blue',reveal?blue:[]);addRows('white',reveal?white:[]);
  for(const [side,arr] of [['blue',blue],['white',white]]){
    $(side+'Sum').textContent=reveal?totalOf(arr).sum:'—';
    $(side+'Avg').textContent=reveal?totalOf(arr).average.toFixed(2):'—';
  }
  const guide=$('guide');guide.classList.toggle('ready',full&&!done);guide.classList.toggle('done',reveal);
  guide.textContent=reveal?'청백 결과 확인 완료 · 모든 참가자가 동일한 배정을 봅니다':
    done?'청백 결정 완료! 각자 빨간 별표를 눌러 결과를 확인하세요.':
    !cap?'별표를 누르면 모든 참가자에게 동일한 결과가 표시됩니다':
    !full?`${cap-countNum}명 미전송입니다 (${countNum}/${cap}명)`:
    '전원 전송 완료! 빨간 별표를 누르세요.';
  $('pending').textContent=(!cap||reveal)?'':done?'각자의 휴대폰에서 별표를 눌러야 결과가 나타납니다.':full?'전원 전송 완료 · 별표를 누르면 동일한 결과가 표시됩니다.':'전원 점수 전송 후 결정할 수 있습니다.';
  let result=done?'★ 빨간 별표를 눌러 경기 결과를 확인하세요.':'전원 전송 후 별표를 누르면 결과가 표시됩니다.';
  if(reveal){const a=totalOf(blue).average,b=totalOf(white).average;result=Math.abs(a-b)<1e-8?'🏆 무승부':a<b?'🏆 청팀 승리!':'🏆 백팀 승리!';}
  $('winner').textContent=result;$('winner').classList.toggle('wait',!reveal);
  $('star').disabled=!(full&&uid)||busy;
  $('star').classList.toggle('ready',full&&!reveal);
  $('star').classList.toggle('active',reveal);
  $('star').textContent=reveal?'★':'☆';
  $('star').title=done?'내 휴대폰에 청백 결과 표시':'전원 전송 후 청백 무작위 결정';
  $('clear').disabled=!(r?.drawn_by===uid&&done);$('save').disabled=!(r?.drawn_by===uid&&done);
  let mine=r?.players?.[uid];if(mine && !['player','score'].includes(document.activeElement?.id)){$('player').value=mine.name;$('score').value=mine.score;}
  // 다른 사람의 결정은 화면에 자동 공개되지 않습니다. 자신의 별표 클릭만 공개를 허용합니다.
  if(done&&wantReveal&&r?.draw_token){
    wantReveal=false;localRevealToken=r.draw_token;render();return;
  }
  if(reveal&&r.draw_token!==lastDrawKey){lastDrawKey=r.draw_token;animateRows();}
  if(!reveal){cancelRevealAnimation();}
}
function cancelRevealAnimation(){
  clearTimeout(revealTimer);for(const t of revealTimeouts)clearTimeout(t);revealTimeouts=[];
  for(const el of document.querySelectorAll('.entry,.totals,#winner'))el.style.visibility='';
}
function animateRows(){
  cancelRevealAnimation();
  const left=[...$('blueEntries').querySelectorAll('.entry')];
  const right=[...$('whiteEntries').querySelectorAll('.entry')];
  const rows=Math.max(left.length,right.length);
  for(const e of [...left,...right])e.style.visibility='hidden';
  const summary=[$('winner'),...document.querySelectorAll('.totals')];
  for(const x of summary)x.style.visibility='hidden';
  for(let i=0;i<rows;i++)revealTimeouts.push(setTimeout(()=>{
    for(const arr of [left,right]){const x=arr[i];if(x){x.style.visibility='visible';x.classList.add('reveal');}}
  },i*700));
  revealTimer=setTimeout(()=>{for(const x of summary){x.style.visibility='visible';x.classList.add('summary-reveal');}},rows*700+300);
}
function stopRoom(){if(unsubscribe){unsubscribe();unsubscribe=null;}cancelRevealAnimation();roomRef=null;current=null;snapshotFromServer=false;localRevealToken='';wantReveal=false;lastDrawKey='';render();}
async function watchRoom(){
  validRoom();
  const id=await roomId();
  if(roomRef?.id===id)return roomRef;
  stopRoom();roomRef=doc(db,'pasis_rooms',id);
  const chosen=roomRef;
  unsubscribe=onSnapshot(chosen,snap=>{
    if(roomRef?.id!==chosen.id)return;
    snapshotFromServer=!snap.metadata.fromCache;
    current=snap.exists()?snap.data():null;
    render();
  },err=>notify('동기화 오류: '+errText(err),true));
  return roomRef;
}
async function transaction(action){
  if(busy)return false;busy=true;
  try{if(!uid)throw Error('Firebase 연결 중입니다. 다시 시도하세요.');const ref=await watchRoom();await runTransaction(db,async tx=>{
    const snap=await tx.get(ref);return action(tx,snap,snap.exists()?snap.data():null);
  });return true;}catch(e){notify(errText(e),true);return false;}finally{busy=false;}
}
$('send').onclick=()=>{
  try{validRoom();validCount();const name=clean($('player').value),score=Number($('score').value),expected=count();
    if(!name||name.length>25)throw Error('이름을 입력하세요.');
    if(!Number.isInteger(score)||score<1||score>500)throw Error('총점을 1~500 사이의 숫자로 입력하세요.');
    transaction((tx,snap,r)=>{
      if(!r){
        tx.set(snap.ref,{date:day,course:clean($('course').value),team:clean($('teamName').value),expected_count:expected,
          players:{[uid]:{name,score}},assignments:{},finalized:false,drawn_by:null,draw_token:null,archive:null});
      }else{
        if(r.finalized)throw Error('이미 결정된 경기입니다.');
        if(r.expected_count!==expected)throw Error(`이 경기는 ${r.expected_count}명으로 등록되어 있습니다. 인원수를 맞춰 주세요.`);
        if(Object.entries(r.players||{}).some(([id,p])=>id!==uid&&p.name===name))throw Error('같은 이름이 이미 등록되어 있습니다.');
        if(!r.players?.[uid] && Object.keys(r.players||{}).length>=expected)throw Error('참가 정원이 찼습니다.');
        tx.update(snap.ref,{[`players.${uid}`]:{name,score}});
      }
    }).then(ok=>{if(ok)showSendSuccess();});
  }catch(e){notify(errText(e),true)}
};
$('star').onclick=async()=>{
  if(busy)return;
  // 이미 추첨 결과가 서버에 있으면 새 추첨 없이 자기 휴대폰에만 공개합니다.
  if(current?.finalized&&current?.draw_token){
    wantReveal=false;localRevealToken=current.draw_token;lastDrawKey='';render();return;
  }
  if(!confirm('모든 참가자의 점수 전송이 완료되었습니다.\n청백팀을 무작위로 결정하고 내 화면에 표시할까요?'))return;
  wantReveal=true;
  const ok=await transaction((tx,snap,r)=>{
    if(!r)throw Error('경기 정보가 없습니다.');
    // 다른 참가자가 먼저 결정했으면 그 결정 결과를 그대로 사용합니다.
    if(r.finalized)return;
    const ids=Object.keys(r.players||{});if(ids.length!==r.expected_count)throw Error('전원 점수 전송 후 결정할 수 있습니다.');
    for(let i=ids.length-1;i>0;i--){const a=new Uint32Array(1);crypto.getRandomValues(a);const j=a[0]%(i+1);[ids[i],ids[j]]=[ids[j],ids[i]];}
    const sides={};ids.forEach((id,i)=>sides[id]=i<Math.ceil(ids.length/2)?'blue':'white');
    tx.update(snap.ref,{assignments:sides,finalized:true,drawn_by:uid,draw_token:crypto.randomUUID()});
  });
  if(!ok){wantReveal=false;render();return;}
  // 전송 완료 전후의 스냅샷 도착 순서에 관계없이 한 번의 클릭으로 표시합니다.
  if(current?.finalized&&current.draw_token){wantReveal=false;localRevealToken=current.draw_token;lastDrawKey='';render();}
  else notify('청백 결정 중입니다. 결과를 받아오면 자동으로 표시됩니다.');
};
$('save').onclick=async()=>{
  if(!confirm('확정된 결과를 보관함에 저장할까요?'))return;
  const saved=await transaction((tx,snap,r)=>{
    if(!r?.finalized||r.drawn_by!==uid)throw Error('결정한 사람만 저장할 수 있습니다.');
    tx.update(snap.ref,{archive:{date:r.date,course:r.course,team:r.team,players:r.players,assignments:r.assignments,expected_count:r.expected_count,saved_at:new Date().toISOString()}});
  });
  if(saved)notify('저장했습니다.');
};
$('clear').onclick=async()=>{
  if(!confirm('현재 경기의 점수와 청백 결과를 모두 삭제할까요?\n보관함에 저장된 기록은 유지합니다.'))return;
  await transaction((tx,snap,r)=>{
    if(!r?.finalized||r.drawn_by!==uid)throw Error('결정한 사람만 결과를 삭제할 수 있습니다.');
    tx.update(snap.ref,{players:{},assignments:{},finalized:false,drawn_by:null,draw_token:null});
  });
};
const dialog=$('dialog');$('cancelDialog').onclick=()=>dialog.close();$('confirmDialog').onclick=()=>dialog.close();
$('load').onclick=async()=>{
  try{const ref=await watchRoom();const snap=await getDoc(ref);const a=snap.data()?.archive;if(!a){notify('저장된 경기 결과가 없습니다.',true);return;}
    const members=Object.entries(a.players||{}).map(([id,p])=>({...p,side:a.assignments[id]}));
    const b=members.filter(x=>x.side==='blue'),w=members.filter(x=>x.side==='white');
    $('dialogTitle').textContent='저장된 경기 결과';
    const body=$('dialogBody');body.replaceChildren();const content=document.createElement('div');content.id='archiveView';
    content.textContent=`${a.date} · ${a.course}파크골프장 · ${a.team}\n저장: ${a.saved_at?.slice(0,19)||''}\n\n청팀\n${b.map(p=>p.name+'  '+p.score+'타').join('\n')}\n합계 ${totalOf(b).sum} / 평균 ${totalOf(b).average.toFixed(2)}\n\n백팀\n${w.map(p=>p.name+'  '+p.score+'타').join('\n')}\n합계 ${totalOf(w).sum} / 평균 ${totalOf(w).average.toFixed(2)}`;
    body.append(content);dialog.showModal();
  }catch(e){notify(errText(e),true)}
};
for(const id of ['course','teamName','expected']){
  const input=$(id);const storage={course:'pasis_course',teamName:'pasis_team',expected:'pasis_expected'}[id];
  input.value=new URL(location.href).searchParams.get(id==='teamName'?'team':id)||localStorage.getItem(storage)||'';
  input.addEventListener('change',()=>{
    localStorage.setItem(storage,clean(input.value));
    if(id!=='expected'){stopRoom();watchRoom().catch(e=>notify(errText(e),true));}
  });
}
// iOS 홈 화면 복귀 시 서버의 최신 인원수를 즉시 확인합니다.
// 실시간 onSnapshot은 계속 유지하며 불필요한 반복 폴링은 하지 않습니다.
let lastForegroundCheck=0;
async function checkFreshAfterResume(){
  if(!roomRef || !uid || document.visibilityState==='hidden')return;
  const now=Date.now();if(now-lastForegroundCheck<1200)return;
  lastForegroundCheck=now;
  const ref=roomRef;
  try{
    const snap=await getDocFromServer(ref);
    if(roomRef?.id!==ref.id || busy)return;
    const fresh=snap.exists()?snap.data():null;
    const oldCount=Object.keys(current?.players||{}).length;
    const newCount=Object.keys(fresh?.players||{}).length;
    if(newCount!==oldCount || fresh?.draw_token!==current?.draw_token || fresh?.expected_count!==current?.expected_count){current=fresh;render();}
  }catch(e){/* 일시적 오프라인이면 기존 실시간 구독으로 재동기화 */}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkFreshAfterResume();});
window.addEventListener('focus',checkFreshAfterResume);
$('modeNotice').textContent='☁️ Firebase 공동 서버 · 청백 배정은 모두 동일하며 결과는 각자 별표를 눌러 공개합니다.';
$('modeNotice').classList.remove('setup');
$('send').disabled=true;
onAuthStateChanged(auth,user=>{
  if(user){uid=user.uid;$('send').disabled=false;
    if(clean($('course').value)&&[...clean($('teamName').value)].length>=4)watchRoom().catch(e=>notify(errText(e),true));
  }else signInAnonymously(auth).catch(e=>notify('익명 인증 오류: '+errText(e),true));
});
</script>
