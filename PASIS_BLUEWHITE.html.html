<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09478c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="파시스 청백">
<title>파시스 청백 게임</title>
<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#102341;background:#eaf1fb;font-size:17px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:760px;margin:auto;background:#fff;min-height:100dvh;padding-bottom:32px}.hero{background:linear-gradient(125deg,#07396f,#0066ae 70%,#1694c1);color:#fff;padding:26px 17px 24px;text-align:center}.brand{font-weight:900;font-size:clamp(26px,6vw,38px);letter-spacing:-1px}.hero small{font-size:15px}.card{margin:14px 12px;padding:17px;border:1px solid #d9e6f6;border-radius:20px;box-shadow:0 5px 15px #0f39600b}.label{display:block;font-weight:800;font-size:17px;margin:10px 0 6px}.input{height:53px;width:100%;border:2px solid #c4d4e6;border-radius:11px;padding:0 12px;background:#fff;min-width:0;color:#112d55;font-size:19px}.input:focus{outline:3px solid #b8ddff;border-color:#1876d1}.date{background:#edf6ff;border-radius:10px;padding:12px;text-align:center;font-weight:800;font-size:19px}.pair{display:grid;grid-template-columns:minmax(0,1fr) 98px;gap:9px}.person{display:flex;gap:8px}.person>.input{flex:1}.star{border:2px solid #e5bd47;border-radius:12px;background:#fff9dc;color:#a77b00;font-size:27px;width:58px;flex:none}.star.active{background:#f9c840;color:#623f00}.big{background:linear-gradient(#147ef3,#0649b1);border:0;border-radius:13px;color:white;min-height:60px;font-size:23px;font-weight:900;width:100%;box-shadow:0 4px 0 #0b3e7a}.hint{font-size:13px;color:#596b82;line-height:1.55;margin-top:8px}.muted{color:#586b83}.status{min-height:20px;font-size:14px;margin:9px 0 0;font-weight:700}.status.error{color:#b52635}.status.ok{color:#117144}.title{display:flex;align-items:center;justify-content:space-between;gap:7px;font-size:22px;font-weight:900;margin-bottom:14px}.counter{font-size:13px;background:#e9f1fc;color:#174f96;padding:6px 9px;border-radius:50px;white-space:nowrap}.teams{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}.team{border:2px solid #c3dfff;border-radius:15px;overflow:hidden}.team.white{border-color:#f2c9d1}.team h3{margin:0;text-align:center;background:#0668cd;color:#fff;padding:12px 0;font-size:21px}.team.white h3{background:#e04768}.entries{min-height:98px;padding:8px}.entry{display:flex;justify-content:space-between;gap:6px;border-bottom:1px solid #e3e9f0;padding:7px 2px;font-size:clamp(13px,3.6vw,18px);font-weight:700}.entry span{overflow-wrap:anywhere}.empty{text-align:center;color:#7c8da2;font-size:14px;padding:23px 3px;line-height:1.6}.totals{background:#e9f4ff;padding:10px 8px;font-weight:800}.white .totals{background:#fff0f3}.totalrow{display:flex;justify-content:space-between;gap:5px;padding:3px 0;font-size:15px}.winner{margin-top:12px;text-align:center;border-radius:15px;background:#fff5d6;padding:18px 8px;font-weight:900;color:#634200;font-size:24px}.winner.wait{background:#eef3f8;color:#65788f;font-size:17px}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px}.action{border:0;min-height:69px;border-radius:14px;font-size:clamp(12px,3.5vw,17px);font-weight:900;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:7px 2px}.action b{font-size:22px}.gold{background:linear-gradient(#ffdb67,#e99f08);color:#573a00}.red{background:linear-gradient(#ff6379,#d92352)}.green{background:linear-gradient(#25be8c,#087d60)}.blue{background:linear-gradient(#338ff7,#0657b9)}.secondary{background:#f2f6fc;color:#24507b;border:1px solid #c8daef;border-radius:9px;padding:9px;font-weight:800}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.mini{font-size:13px}.notice{background:#f2f7fd;border-left:4px solid #3c85dc;padding:10px 12px;margin:12px;border-radius:6px;font-size:13px;line-height:1.55}.setup{background:#fff7df;color:#684f0a}.hide{display:none!important}dialog{border:none;border-radius:16px;max-width:min(95vw,480px);width:100%;box-shadow:0 18px 70px #0005;padding:21px}dialog::backdrop{background:#07152ca0}dialog h3{margin-top:0}dialog .row{justify-content:flex-end;margin-top:15px}dialog button{min-height:44px}#archiveView{white-space:pre-line;font-size:14px;line-height:1.8;max-height:55vh;overflow:auto;background:#f4f7fa;padding:12px;border-radius:10px}footer{font-size:12px;color:#7a8da1;text-align:center;padding:15px}
</style>
</head>
<body><div class="wrap">
<header class="hero"><div class="brand">🏌️ 파시스 <span style="color:#ffe064">청백</span> 게임</div><small>파크골프 친선경기 · 함께 즐기는 오늘의 운수</small></header>
<section class="card">
<div class="label">📅 경기 날짜 (자동)</div><div id="date" class="date"></div>
<label class="label" for="course">📍 골프장명</label><input class="input" id="course" placeholder="예: 안동 파크골프장" autocomplete="off" maxlength="60">
<label class="label" for="teamName">👥 팀명 (6자 이상, 한글·영문·숫자)</label><input class="input" id="teamName" placeholder="예: 파시스친선회11" autocomplete="off" maxlength="40">
<div class="pair"><div><label class="label" for="player">👤 내 이름</label><div class="person"><input class="input" id="player" placeholder="이름" autocomplete="name" maxlength="25"><button id="star" class="star" title="오늘의 진행자 지정" aria-label="진행자 지정">☆</button></div></div><div><label class="label" for="score">⛳ 총점</label><input class="input" id="score" type="number" inputmode="numeric" placeholder="타수" min="1" max="500"></div></div>
<div class="hint">☆ 그날 지정된 진행자만 누릅니다. 최초 지정된 진행자만 👑 결정·결과삭제·저장을 할 수 있습니다.</div>
<button id="send" class="big" style="margin-top:16px">✈ 점수 전송</button><div id="status" class="status" role="status"></div>
<div class="row" style="margin-top:10px"><button id="share" class="secondary">🔗 경기 주소 공유</button><button id="refresh" class="secondary">↻ 새로고침</button></div>
</section>
<section class="card"><div class="title">🏆 청백 결과판 <span id="count" class="counter">참가 0명</span></div>
<div class="teams"><div class="team"><h3>🔵 청팀</h3><div class="entries" id="blueEntries"><div class="empty">👑 결정 전입니다</div></div><div class="totals"><div class="totalrow"><span>합계</span><span id="blueSum">—</span></div><div class="totalrow"><span>평균</span><span id="blueAvg">—</span></div></div></div><div class="team white"><h3>⚪ 백팀</h3><div class="entries" id="whiteEntries"><div class="empty">👑 결정 전입니다</div></div><div class="totals"><div class="totalrow"><span>합계</span><span id="whiteSum">—</span></div><div class="totalrow"><span>평균</span><span id="whiteAvg">—</span></div></div></div></div>
<div class="winner wait" id="winner">점수 전송 후 진행자가 👑 결정을 누릅니다.</div><div id="pending" class="hint" style="text-align:center"></div></section>
<div class="actions"><button class="action gold" id="draw" disabled><b>👑</b>결정</button><button class="action red" id="clear" disabled><b>🗑</b>결과삭제</button><button class="action green" id="save" disabled><b>▣</b>저장</button><button class="action blue" id="load"><b>📂</b>불러오기</button></div>
<div id="modeNotice" class="notice setup"></div><footer>PASIS 청백 게임 1.0 · 큰 글씨 / 간편 점수 입력 / 공동 경기 결과</footer></div>
<dialog id="dialog"><h3 id="dialogTitle"></h3><div id="dialogBody"></div><div class="row"><button class="secondary" id="cancelDialog">닫기</button><button class="secondary" id="confirmDialog">확인</button></div></dialog>
<script>
/* 공개 배포용 설정: Supabase 프로젝트의 URL과 publishable(또는 anon) 키만 입력하세요. service_role 키는 절대 넣지 마세요. */
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const date=today();$('date').textContent=new Date(date+'T12:00:00').toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'});
const connected=!!(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase);const client=connected?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
let organizerWanted=false,current=null,archive=null,loading=false;const demoStorage='pasis_bluewhite_demo_v1';
const clean=s=>String(s??'').trim();const key=()=>[date,clean($('course').value),clean($('teamName').value)].join('¦');
const entryInputs=()=>({p_day:date,p_course:clean($('course').value),p_team:clean($('teamName').value)});
const validRoom=()=>{if(!clean($('course').value))throw Error('골프장명을 입력하세요.');if([...clean($('teamName').value)].length<6)throw Error('팀명은 6자 이상 입력하세요.');};
const state=()=>{let all={};try{all=JSON.parse(localStorage.getItem(demoStorage)||'{}')}catch{};return all};
const saveDemo=x=>{let all=state();all[key()]=x;localStorage.setItem(demoStorage,JSON.stringify(all));window.dispatchEvent(new Event('storage'))};
const localId=()=>{let id=localStorage.getItem('pasis_bw_device_id');if(!id){id=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();localStorage.setItem('pasis_bw_device_id',id)}return id};
const empty=()=>({entries:[],organizer_uid:null,finalized:false,archive:null});
const notice=(msg,error=false)=>{$('status').textContent=msg;$('status').className='status '+(error?'error':'ok')};
const errMsg=e=>(e&&e.message)||'작업을 완료하지 못했습니다.';
const identity=async()=>{if(!connected)return localId();let {data:{session}}=await client.auth.getSession();if(!session){const {data,error}=await client.auth.signInAnonymously();if(error)throw error;session=data.session}return session.user.id};
const api=async(name,p={})=>{const {data,error}=await client.rpc(name,p);if(error)throw error;return data};
const get=async()=>{if(connected)return await api('pasis_get',entryInputs());return state()[key()]||empty()};
const currentOrganizer=async()=>{if(!current)return false;return current.organizer_uid===(await identity())};
const teamRows=(side,rows)=>{const node=$(side+'Entries');node.replaceChildren();if(!rows.length){const d=document.createElement('div');d.className='empty';d.textContent=current?.finalized?'배정 없음':'👑 결정 전입니다';node.appendChild(d);return}for(const p of rows){const row=document.createElement('div'),n=document.createElement('span'),s=document.createElement('strong');row.className='entry';n.textContent=p.player_name;s.textContent=p.score;row.append(n,s);node.appendChild(row)}};
const display=async()=>{const rows=current?.entries||[],done=!!current?.finalized;let b=rows.filter(x=>x.side==='blue'),w=rows.filter(x=>x.side==='white');teamRows('blue',b);teamRows('white',w);for(const [id,arr] of [['blue',b],['white',w]]){$(id+'Sum').textContent=done?arr.reduce((s,x)=>s+x.score,0):'—';$(id+'Avg').textContent=done&&arr.length?(arr.reduce((s,x)=>s+x.score,0)/arr.length).toFixed(2):'—';}$('count').textContent='참가 '+rows.length+'명';$('pending').textContent=done?'무작위 배정 완료 · 모든 회원에게 동일하게 표시됩니다.':rows.length?`현재 ${rows.length}명 전송 완료 · 결정 전 명단은 공개하지 않습니다.`:'점수를 전송하면 참가자 수가 표시됩니다.';let bavg=b.length?b.reduce((s,x)=>s+x.score,0)/b.length:null,wavg=w.length?w.reduce((s,x)=>s+x.score,0)/w.length:null;let label=done?(bavg===null||wavg===null?'참가 인원이 부족합니다.':Math.abs(bavg-wavg)<1e-9?'🏆 무승부':bavg<wavg?'🏆 청팀 승리!':'🏆 백팀 승리!'):'점수 전송 후 진행자가 👑 결정을 누릅니다.';$('winner').textContent=label;$('winner').className='winner '+(!done?'wait':'');const org=await currentOrganizer();$('draw').disabled=!org||done||rows.length<2;$('clear').disabled=!org||rows.length===0;$('save').disabled=!org||!done;const uid=await identity();let mine=rows.find(x=>x.user_uid===uid);if(mine&&!document.activeElement.matches('input')){$('player').value=mine.player_name;$('score').value=mine.score}if(org){$('star').classList.add('active');$('star').textContent='★'}else{$('star').classList.remove('active');$('star').textContent='☆'}};
const refresh=async(silent=false)=>{if(!clean($('course').value)||[...clean($('teamName').value)].length<6)return;try{await identity();current=await get();await display();if(!silent)notice('최신 결과를 불러왔습니다.')}catch(e){if(!silent)notice(errMsg(e),true)}};
const call=async(action)=>{if(loading)return;loading=true;try{validRoom();await identity();await action();current=await get();await display()}catch(e){notice(errMsg(e),true)}finally{loading=false}};
$('star').onclick=()=>{organizerWanted=!organizerWanted;$('star').textContent=organizerWanted?'★':'☆';$('star').classList.toggle('active',organizerWanted);notice(organizerWanted?'진행자 선택: 점수 전송 시 진행자 지정을 시도합니다.':'진행자 선택 해제')};
$('send').onclick=()=>call(async()=>{const name=clean($('player').value),score=Number($('score').value);if(!name)throw Error('이름을 입력하세요.');if(!Number.isInteger(score)||score<1||score>500)throw Error('총점을 1~500 사이의 정수로 입력하세요.');if(connected){await api('pasis_submit',{...entryInputs(),p_name:name,p_score:score});if(organizerWanted)await api('pasis_claim',entryInputs())}else{const x=state()[key()]||empty();if(x.finalized)throw Error('이미 결정된 경기입니다.');const id=localId();if(x.entries.some(p=>p.player_name===name&&p.user_uid!==id))throw Error('같은 이름이 이미 등록되었습니다. 이름을 구분해서 입력하세요.');x.entries=x.entries.filter(p=>p.user_uid!==id);x.entries.push({user_uid:id,player_name:name,score,side:null});if(organizerWanted){if(x.organizer_uid&&x.organizer_uid!==id)throw Error('이미 다른 진행자가 지정되었습니다.');x.organizer_uid=id}saveDemo(x)}notice('점수가 등록되었습니다.');organizerWanted=false});
$('draw').onclick=async()=>{if(!confirm('현재 등록된 회원으로 청백팀을 무작위로 결정하시겠습니까?\n결정 후에는 점수를 수정할 수 없습니다.'))return;await call(async()=>{if(connected)await api('pasis_draw',entryInputs());else{const x=state()[key()];if(x.organizer_uid!==localId())throw Error('진행자만 결정할 수 있습니다.');if(x.finalized)throw Error('이미 결정되었습니다.');if(x.entries.length<2)throw Error('최소 2명 이상 필요합니다.');const shuffled=[...x.entries];for(let i=shuffled.length-1;i>0;i--){const a=new Uint32Array(1);crypto.getRandomValues(a);let j=a[0]%(i+1);[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}shuffled.forEach((p,i)=>p.side=i<Math.ceil(shuffled.length/2)?'blue':'white');x.entries=shuffled;x.finalized=true;saveDemo(x)}notice('청백팀 결정 완료!')})};
$('clear').onclick=async()=>{if(!confirm('현재 경기의 점수와 청백 결과를 모두 삭제할까요?\n이미 저장한 보관 기록은 유지됩니다.'))return;await call(async()=>{if(connected)await api('pasis_clear',entryInputs());else{const x=state()[key()];if(x.organizer_uid!==localId())throw Error('진행자만 삭제할 수 있습니다.');x.entries=[];x.finalized=false;saveDemo(x)}notice('현재 경기 결과를 삭제했습니다.')})};
$('save').onclick=()=>call(async()=>{if(connected)await api('pasis_save',entryInputs());else{const x=state()[key()];if(x.organizer_uid!==localId())throw Error('진행자만 저장할 수 있습니다.');if(!x.finalized)throw Error('결정 후 저장하세요.');x.archive={saved_at:new Date().toISOString(),entries:structuredClone(x.entries),finalized:true};saveDemo(x)}notice('결과를 보관함에 저장했습니다.')});
const d=$('dialog');$('cancelDialog').onclick=()=>d.close();$('confirmDialog').onclick=()=>d.close();
$('load').onclick=async()=>{try{validRoom();await identity();archive=connected?await api('pasis_load',entryInputs()):((state()[key()]||{}).archive||null);if(!archive){notice('이 날짜·골프장·팀명으로 저장된 결과가 없습니다.',true);return}const a=archive.entries||[];const list=s=>a.filter(x=>x.side===s),sum=s=>list(s).reduce((n,x)=>n+x.score,0),average=s=>list(s).length?(sum(s)/list(s).length).toFixed(2):'—';$('dialogTitle').textContent='📂 저장된 경기 결과';$('dialogBody').replaceChildren();const content=document.createElement('div');content.id='archiveView';content.textContent=`저장 일시: ${archive.saved_at?new Date(archive.saved_at).toLocaleString('ko-KR'):'기록 없음'}\n\n🔵 청팀\n${list('blue').map(x=>x.player_name+'  '+x.score+'타').join('\n')}\n합계 ${sum('blue')} / 평균 ${average('blue')}\n\n⚪ 백팀\n${list('white').map(x=>x.player_name+'  '+x.score+'타').join('\n')}\n합계 ${sum('white')} / 평균 ${average('white')}`;$('dialogBody').appendChild(content);d.showModal();notice('저장된 결과를 불러왔습니다.')}catch(e){notice(errMsg(e),true)}};
$('refresh').onclick=()=>refresh();$('share').onclick=async()=>{try{validRoom();const url=new URL(location.href);url.searchParams.set('course',clean($('course').value));url.searchParams.set('team',clean($('teamName').value));if(navigator.share)await navigator.share({title:'파시스 청백 게임',url:url.href});else{await navigator.clipboard.writeText(url.href);notice('경기 주소가 복사되었습니다. 회원에게 보내세요.')}}catch(e){notice(errMsg(e),true)}};
const qs=new URL(location.href).searchParams;$('course').value=qs.get('course')||localStorage.getItem('pasis_course')||'';$('teamName').value=qs.get('team')||localStorage.getItem('pasis_team')||'';
for(let id of ['course','teamName'])$(id).addEventListener('change',()=>{localStorage.setItem(id==='course'?'pasis_course':'pasis_team',clean($(id).value));current=null;['draw','clear','save'].forEach(x=>$(x).disabled=true);refresh(true)});
$('modeNotice').innerHTML=connected?'✅ <strong>공동 서버 연결 모드</strong> · 회원의 점수는 서버에 보관되며 약 5초 간격으로 새로 반영됩니다.':'⚠️ <strong>단독 시험 모드</strong> · 이 화면은 이 브라우저에만 저장됩니다. 여러 휴대폰에서 공유하려면 HTML 상단에 Supabase URL·공개 키를 설정하고 제공된 SQL을 실행해야 합니다.';
if(connected)identity().then(()=>refresh(true)).catch(e=>notice('인증 실패: '+errMsg(e),true));else refresh(true);setInterval(()=>{if(!document.hidden&&!loading&&!d.open)refresh(true)},5000);
})();
</script></body></html>
