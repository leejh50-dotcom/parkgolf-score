<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>파시스 sv3.0 클럽대회용</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="파시스3">
<meta name="theme-color" content="#1a5634">
<link rel="apple-touch-icon" sizes="180x180" href="sv3-180-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="sv3-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green-dark:  #1a5634;
  --green-mid:   #2d7a4f;
  --green-light: #3d9e68;
  --green-pale:  #e8f5ee;
  --gold:        #f0c040;
  --gold-dark:   #c8960a;
  --white:       #ffffff;
  --cream:       #faf8f3;
  --text-dark:   #1a2e22;
  --text-mid:    #3d5a46;
}

html, body {
  height: 100%;
  overflow-y: auto;
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--green-dark);
}

/* ── 배경 ── */
.bg {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% -10%, #3d9e6844 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 100% 100%, #0f4a2488 0%, transparent 60%),
    linear-gradient(160deg, #1a5634 0%, #0d3320 55%, #0a2818 100%);
  z-index: 0;
  min-height: 100%;
}

/* 잔디 패턴 */
.bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    repeating-linear-gradient(
      45deg,
      transparent,
      transparent 28px,
      rgba(255,255,255,0.018) 28px,
      rgba(255,255,255,0.018) 56px
    );
  z-index: 1;
}

/* 빛 효과 */
.bg::after {
  content: '';
  position: absolute;
  top: -30%;
  left: 50%;
  transform: translateX(-50%);
  width: 140%;
  height: 80%;
  background: radial-gradient(ellipse, rgba(61,158,104,0.18) 0%, transparent 65%);
  z-index: 2;
}

/* ── 레이아웃 ── */
.wrap {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 28px 20px 36px;
  gap: 0;
}

/* ── 카드 ── */
.card {
  width: 100%;
  max-width: 400px;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 28px;
  padding: 36px 28px 32px;
  box-shadow:
    0 32px 80px rgba(0,0,0,0.45),
    0 0 0 1px rgba(255,255,255,0.06) inset,
    0 1px 0 rgba(255,255,255,0.18) inset;
  animation: rise 0.7s cubic-bezier(0.22,1,0.36,1) both;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(28px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0)    scale(1); }
}

/* ── 아이콘 배지 ── */
.icon-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
}
.icon-circle {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  background: linear-gradient(145deg, var(--green-light), var(--green-dark));
  border: 2px solid rgba(255,255,255,0.22);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  box-shadow:
    0 8px 24px rgba(0,0,0,0.35),
    0 0 0 6px rgba(61,158,104,0.18);
  animation: pulse 3s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 0 6px rgba(61,158,104,0.18); }
  50%       { box-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 0 12px rgba(61,158,104,0.08); }
}

/* ── 제목 ── */
.title-en {
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 4px;
  color: rgba(255,255,255,0.45);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.title-main {
  text-align: center;
  font-size: 26px;
  font-weight: 900;
  color: #ffffff;
  letter-spacing: -0.5px;
  line-height: 1.2;
  margin-bottom: 4px;
}
.title-sub {
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  color: rgba(255,255,255,0.55);
  letter-spacing: 1px;
  margin-bottom: 8px;
}

/* ── 배지 ── */
.badge-row {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
}
.badge-free {
  background: rgba(240,192,64,0.18);
  color: var(--gold);
  border: 1px solid rgba(240,192,64,0.35);
}
.badge-free::before { content: '✦'; font-size: 9px; }
.badge-ver {
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.65);
  border: 1px solid rgba(255,255,255,0.15);
}

/* ── 구분선 ── */
.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  margin-bottom: 24px;
}

/* ── 선택 라벨 ── */
.select-label {
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: rgba(255,255,255,0.4);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 14px;
}

/* ── 버튼 ── */
.btn-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.btn {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 18px 20px;
  border: none;
  border-radius: 16px;
  cursor: pointer;
  text-align: left;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  overflow: hidden;
}
.btn:active {
  transform: scale(0.97);
}

/* 관리자 버튼 */
.btn-admin {
  background: linear-gradient(135deg, #f0c040 0%, #c8960a 100%);
  box-shadow: 0 6px 24px rgba(200,150,10,0.4);
}
.btn-admin::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 60%);
  border-radius: inherit;
  pointer-events: none;
}
.btn-admin:hover {
  box-shadow: 0 8px 32px rgba(200,150,10,0.55);
  transform: translateY(-2px);
}

/* 경기자 버튼 */
.btn-player {
  background: rgba(255,255,255,0.09);
  border: 1.5px solid rgba(255,255,255,0.2);
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
}
.btn-player::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.07) 0%, transparent 60%);
  border-radius: inherit;
  pointer-events: none;
}
.btn-player:hover {
  background: rgba(255,255,255,0.14);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}

/* 버튼 아이콘 */
.btn-icon {
  width: 46px;
  height: 46px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.btn-admin .btn-icon {
  background: rgba(0,0,0,0.15);
}
.btn-player .btn-icon {
  background: rgba(255,255,255,0.1);
}

/* 버튼 텍스트 */
.btn-text { flex: 1; }
.btn-title {
  display: block;
  font-size: 17px;
  font-weight: 900;
  line-height: 1.2;
  letter-spacing: -0.3px;
}
.btn-desc {
  display: block;
  font-size: 12px;
  font-weight: 500;
  margin-top: 3px;
  opacity: 0.75;
  line-height: 1.4;
}
.btn-admin .btn-title { color: #3d2200; }
.btn-admin .btn-desc  { color: #5a3800; }
.btn-player .btn-title { color: #ffffff; }
.btn-player .btn-desc  { color: rgba(255,255,255,0.65); }

/* 화살표 */
.btn-arrow {
  font-size: 18px;
  flex-shrink: 0;
  opacity: 0.5;
}
.btn-admin .btn-arrow  { color: #3d2200; }
.btn-player .btn-arrow { color: #ffffff; }

/* 미리보기 버튼 */
.btn-preview {
  background: rgba(61,158,104,0.15);
  border: 1.5px solid rgba(61,158,104,0.35);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.btn-preview::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, transparent 60%);
  border-radius: inherit;
  pointer-events: none;
}
.btn-preview:hover {
  background: rgba(61,158,104,0.25);
  transform: translateY(-2px);
}
.btn-preview .btn-icon { background: rgba(61,158,104,0.2); }
.btn-preview .btn-title { color: #a8e6c0; }
.btn-preview .btn-desc  { color: rgba(168,230,192,0.65); }
.btn-preview .btn-arrow { color: #a8e6c0; }
.qr-notice {
  display: none;
  margin-top: 14px;
  padding: 16px 18px;
  background: rgba(255,255,255,0.06);
  border: 1.5px solid rgba(255,255,255,0.15);
  border-radius: 14px;
  text-align: center;
  animation: fadeIn 0.3s ease;
}
.qr-notice.show { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.qr-notice .qr-icon { font-size: 32px; margin-bottom: 8px; }
.qr-notice .qr-text {
  font-size: 14px;
  font-weight: 700;
  color: #ffffff;
  line-height: 1.6;
}
.qr-notice .qr-sub {
  font-size: 12px;
  color: rgba(255,255,255,0.55);
  margin-top: 6px;
  line-height: 1.5;
}

/* ── 하단 안내 ── */
.footer-note {
  margin-top: 20px;
  text-align: center;
  font-size: 14px;
  font-weight: 700;
  color: rgba(255,255,255,0.82);
  line-height: 1.8;
  letter-spacing: 0.3px;
}

/* ── 버튼 애니메이션 딜레이 ── */
.btn-admin   { animation: rise 0.7s 0.1s cubic-bezier(0.22,1,0.36,1) both; }
.btn-player  { animation: rise 0.7s 0.2s cubic-bezier(0.22,1,0.36,1) both; }
.btn-preview { animation: rise 0.7s 0.3s cubic-bezier(0.22,1,0.36,1) both; }

/* ── 모바일 최적화 ── */
@media (max-height: 680px) {
  .card { padding: 26px 24px 24px; }
  .icon-circle { width: 60px; height: 60px; font-size: 28px; }
  .title-main { font-size: 22px; }
  .btn { padding: 14px 16px; }
  .btn-icon { width: 40px; height: 40px; font-size: 19px; }
  .btn-title { font-size: 15px; }
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="wrap">
  <div class="card">

    <div class="icon-wrap">
      <div class="icon-circle">⛳</div>
    </div>

    <p class="title-en">Parkgolf Scoring System</p>
    <h1 class="title-main">파시스 sv3.0</h1>
    <p class="title-sub">클럽대회용</p>

    <div class="badge-row">
      <span class="badge badge-ver">Club Edition</span>
    </div>

    <div class="btn-group">

      <!-- 관리자 버튼 -->
      <button class="btn btn-admin" onclick="goAdmin()">
        <div class="btn-icon">🔒</div>
        <div class="btn-text">
          <span class="btn-title">관리자 전용</span>
          <span class="btn-desc">대회 준비 · QR 생성 · 결과 집계</span>
        </div>
        <span class="btn-arrow">›</span>
      </button>

      <!-- 미리보기 버튼 -->
      <button class="btn btn-preview" onclick="goPreview()">
        <div class="btn-icon">👁️</div>
        <div class="btn-text">
          <span class="btn-title">앱 미리보기</span>
          <span class="btn-desc">UI 탐색 · 점수기록 체험 · 공유까지 가능</span>
        </div>
        <span class="btn-arrow">›</span>
      </button>

      <!-- 경기자 버튼 -->
      <button class="btn btn-player" onclick="showQrNotice()">
        <div class="btn-icon">📱</div>
        <div class="btn-text">
          <span class="btn-title">경기자 입장</span>
          <span class="btn-desc">점수 입력 · 대회 전송</span>
        </div>
        <span class="btn-arrow">›</span>
      </button>

    </div>

    <!-- 경기자 QR 안내 -->
    <div class="qr-notice" id="qrNotice">
      <div class="qr-icon">📷</div>
      <p class="qr-text">관리자에게 받은 QR코드를<br>카메라로 스캔해주세요</p>
      <p class="qr-sub">QR코드 스캔으로 접속해야<br>대회코드가 자동으로 입력됩니다</p>
    </div>

  </div>


</div>

<script>
/* QR 스캔으로 들어온 경우 → sv3.html로 자동 이동 */
(function(){
  var params = window.location.search;
  if (params && (params.indexOf('e=') !== -1 || params.indexOf('s=') !== -1 || params.indexOf('w=') !== -1)) {
    window.location.replace('sv3.html' + params);
  }
})();

function goAdmin() {
  window.location.href = 'sv3.html?admin=1';
}

function goPreview() {
  window.location.href = 'sv3.html?preview=1&v=4';
}

function showQrNotice() {
  var notice = document.getElementById('qrNotice');
  notice.classList.toggle('show');
}
</script>
</body>
</html>
