<script>
/* ===== scoreModal fix3: 실제 뷰포트 높이 + 키패드 스크롤 + 배경 잠금 ===== */
(function () {

  /* A. window.innerHeight 기반 --real-vh 설정 (iOS 주소창 실제 높이 반영) */
  function setRealVh() {
    var vh = window.innerHeight * 0.01;
    document.documentElement.style.setProperty('--real-vh', vh + 'px');
  }
  setRealVh();
  window.addEventListener('resize', setRealVh);
  window.addEventListener('orientationchange', function () { setTimeout(setRealVh, 300); });

  /* B. scoreModal 열림/닫힘 → body 스크롤 잠금 */
  function initModalWatch() {
    var modal = document.getElementById('scoreModal');
    if (!modal) return;
    new MutationObserver(function () {
      document.body.style.overflow = modal.classList.contains('show') ? 'hidden' : '';
    }).observe(modal, { attributes: true, attributeFilter: ['class'] });
  }

  /* C. 키패드 자체 touchmove: 경계에서만 preventDefault, 중간은 허용 */
  function initKeyboardScroll() {
    var modal = document.getElementById('scoreModal');
    if (!modal) return;
    var kb = modal.querySelector('.keyboard');
    if (!kb) return;
    var startY = 0;
    kb.addEventListener('touchstart', function (e) {
      startY = e.touches[0].clientY;
    }, { passive: true });
    kb.addEventListener('touchmove', function (e) {
      var dy = e.touches[0].clientY - startY;
      var atTop    = kb.scrollTop <= 0 && dy > 0;
      var atBottom = kb.scrollTop + kb.clientHeight >= kb.scrollHeight - 1 && dy < 0;
      if (atTop || atBottom) { e.preventDefault(); }
    }, { passive: false });
  }

  /* D. 오버레이(키패드 외 영역) touchmove 차단 */
  function initOverlayBlock() {
    var modal = document.getElementById('scoreModal');
    if (!modal) return;
    modal.addEventListener('touchmove', function (e) {
      var kb = modal.querySelector('.keyboard');
      if (kb && (e.target === kb || kb.contains(e.target))) return;
      e.preventDefault();
    }, { passive: false });
  }

  function init() { initModalWatch(); initKeyboardScroll(); initOverlayBlock(); }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
